<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flag Battle — Global Arrow Arena</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #04050b;
      --bg-1: #0b1020;
      --text: #ecf2ff;
      --text-dim: #93a6cf;
      --panel: rgba(10, 16, 31, 0.84);
      --border: rgba(142, 166, 224, 0.25);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 18%, #18284f 0%, #070a13 55%, #020307 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
      letter-spacing: 0.02em;
    }

    #app {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      margin: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(4px, 0.7vw, 7px);
      padding: clamp(8px, 1.2vw, 14px);
    }

    #topHud {
      background: linear-gradient(145deg, rgba(19, 30, 58, 0.87), rgba(9, 13, 24, 0.92));
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: inset 0 0 16px rgba(85, 128, 228, 0.12), 0 0 24px rgba(0, 0, 0, 0.34);
      padding: clamp(10px, 1.4vw, 14px) clamp(11px, 1.6vw, 16px);
      display: grid;
      gap: 7px;
    }

    .hud-title {
      margin: 0;
      font-size: clamp(26px, 4.3vw, 39px);
      letter-spacing: 0.1em;
      line-height: 1;
      font-weight: 850;
      text-shadow: 0 0 14px rgba(87, 208, 255, 0.3);
      text-align: center;
    }

    .hud-meta {
      display: grid;
      grid-template-columns: minmax(80px, 96px) 1fr minmax(80px, 96px);
      align-items: center;
      gap: clamp(8px, 1.2vw, 16px);
      min-height: 0;
    }

    .meta-block {
      display: grid;
      justify-items: center;
      align-items: center;
      gap: 2px;
    }

    .label {
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.1em;
      text-align: center;
    }

    #lastWinnerFlag {
      font-size: clamp(26px, 3.8vw, 40px);
      line-height: 1;
      min-height: 1em;
    }

    #roundLabel {
      font-size: clamp(18px, 2.8vw, 30px);
      line-height: 1;
      font-weight: 860;
      color: #e7f4ff;
      text-shadow: 0 0 10px rgba(87, 208, 255, 0.28);
      min-height: 1em;
    }

    .center-meta {
      min-width: 0;
      text-align: center;
    }

    #tagline {
      color: #d8e4ff;
      font-size: clamp(11px, 1.7vw, 15px);
      letter-spacing: 0.08em;
      font-weight: 640;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #aliveLabel {
      margin-top: 4px;
      color: #e4f4ff;
      text-shadow: 0 0 8px rgba(87, 208, 255, 0.23);
      font-size: clamp(15px, 2.1vw, 21px);
      letter-spacing: 0.06em;
      font-weight: 820;
    }

    #arenaPane {
      position: relative;
      width: 100%;
      height: 100%;
      justify-self: center;
      align-self: center;
      min-height: 0;
      border-radius: 18px;
      border: 1px solid rgba(112, 138, 198, 0.32);
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, rgba(21, 32, 60, 0.86), rgba(8, 11, 21, 0.95));
      box-shadow: inset 0 0 30px rgba(71, 115, 223, 0.14), 0 10px 28px rgba(0, 0, 0, 0.34);
    }

    #battleCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #eventToast {
      position: absolute;
      top: clamp(12px, 2.2vw, 20px);
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      border-radius: 11px;
      border: 1px solid rgba(255, 172, 80, 0.55);
      background: linear-gradient(145deg, rgba(62, 29, 14, 0.9), rgba(35, 14, 7, 0.9));
      color: #ffe6c7;
      padding: clamp(8px, 1.1vw, 12px) clamp(12px, 2.1vw, 18px);
      font-size: clamp(12px, 1.8vw, 17px);
      font-weight: 740;
      letter-spacing: 0.05em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 8;
      text-align: center;
      max-width: min(90%, 420px);
    }

    #eventToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      transition: opacity 0.24s ease;
      z-index: 10;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      background: radial-gradient(circle at top, rgba(33, 49, 84, 0.84), rgba(10, 16, 31, 0.92) 78%);
      border: 1px solid rgba(137, 170, 242, 0.34);
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), inset 0 0 22px rgba(87, 208, 255, 0.13);
      padding: clamp(17px, 3.2vw, 29px);
      width: min(88%, 500px);
    }

    #startOverlay h2 {
      margin: 0;
      font-size: clamp(32px, 5.6vw, 54px);
      letter-spacing: 0.11em;
      line-height: 1;
      text-shadow: 0 0 18px rgba(87, 208, 255, 0.33);
    }

    #startOverlay p {
      margin: 12px 0;
      color: #cbdbff;
      font-size: clamp(14px, 2.3vw, 22px);
      font-weight: 650;
      letter-spacing: 0.07em;
    }

    .btn {
      border: 1px solid rgba(133, 157, 215, 0.42);
      border-radius: 10px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(34, 51, 84, 0.9), rgba(19, 26, 44, 0.9));
      cursor: pointer;
      font-size: clamp(11px, 1.6vw, 14px);
      font-weight: 650;
      letter-spacing: 0.03em;
      padding: 8px 12px;
      transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      border-color: rgba(124, 194, 255, 0.66);
      box-shadow: 0 6px 18px rgba(80, 182, 255, 0.22);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      min-width: 190px;
      font-size: clamp(13px, 2.1vw, 18px);
      border-color: rgba(124, 207, 255, 0.75);
      background: linear-gradient(130deg, #1e4a98 0%, #2f3ca8 45%, #532ea3 100%);
      padding: clamp(10px, 1.4vw, 14px) clamp(14px, 2.4vw, 24px);
      box-shadow: 0 0 22px rgba(87, 208, 255, 0.25);
      margin-top: 8px;
    }

    #countdownOverlay {
      font-size: clamp(70px, 14vw, 145px);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #f7fbff;
      text-shadow: 0 0 24px rgba(87, 208, 255, 0.5), 0 0 58px rgba(152, 125, 255, 0.38);
      pointer-events: none;
      z-index: 9;
    }

    #countdownOverlay.animate {
      animation: pop 0.72s cubic-bezier(0.12, 0.84, 0.21, 1);
    }

    @keyframes pop {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      35% {
        opacity: 1;
      }
      100% {
        transform: scale(1.07);
        opacity: 0;
      }
    }

    #winnerOverlay .crown {
      font-size: clamp(31px, 5vw, 48px);
      font-weight: 840;
      letter-spacing: 0.08em;
      color: #ffdf93;
      text-shadow: 0 0 18px rgba(255, 224, 147, 0.34);
      margin-bottom: 8px;
    }

    #winnerFlag {
      font-size: clamp(74px, 12vw, 140px);
      line-height: 1;
      margin: 8px 0;
      filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.28));
    }

    #winnerName {
      font-size: clamp(31px, 5.1vw, 56px);
      font-weight: 860;
      letter-spacing: 0.08em;
      margin: 0;
      text-shadow: 0 0 16px rgba(87, 208, 255, 0.34);
    }

    #winnerText {
      margin: 8px 0 12px;
      color: #e4ecff;
      font-size: clamp(13px, 2vw, 19px);
      letter-spacing: 0.1em;
      font-weight: 630;
    }

    #statusArea {
      min-height: 140px;
      max-height: 220px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 9px 10px;
      box-shadow: inset 0 0 14px rgba(75, 110, 193, 0.12);
      min-height: 0;
    }

    #eliminatedFlags {
      margin-top: 8px;
      min-height: 36px;
      max-height: 156px;
      overflow: auto;
      scrollbar-width: thin;
      display: flex;
      flex-wrap: wrap;
      gap: 3px 5px;
      align-items: center;
      align-content: flex-start;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.05;
      padding-right: 2px;
    }

    #eliminatedFlags span {
      filter: drop-shadow(0 0 8px rgba(89, 170, 255, 0.15));
    }

    body.stream-mode #app {
      padding: clamp(6px, 1vw, 10px);
    }

    body.stream-mode #startOverlay,
    body.autostart-mode #startOverlay {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="topHud">
      <h1 class="hud-title">FLAG BATTLE</h1>
      <div class="hud-meta">
        <div class="meta-block">
          <div class="label">LAST WINNER</div>
          <div id="lastWinnerFlag">—</div>
        </div>
        <div class="center-meta">
          <div id="tagline">COUNTRIES • ONE WINNER</div>
          <div id="aliveLabel">ALIVE: -- / --</div>
        </div>
        <div class="meta-block">
          <div class="label">ROUND</div>
          <div id="roundLabel">1</div>
        </div>
      </div>
    </header>

    <main id="arenaPane">
      <canvas id="battleCanvas"></canvas>
      <div id="eventToast"></div>

      <div id="startOverlay" class="overlay">
        <div class="card">
          <h2>FLAG BATTLE</h2>
          <p id="startCountriesLine">COUNTRIES</p>
          <p>ONE WINNER</p>
          <button id="startBtn" class="btn primary">START BATTLE</button>
        </div>
      </div>

      <div id="countdownOverlay" class="overlay hidden"></div>

      <div id="winnerOverlay" class="overlay hidden">
        <div class="card">
          <div class="crown">🏆 WINNER</div>
          <div id="winnerFlag"></div>
          <p id="winnerName"></p>
          <p id="winnerText">WINS THE FLAG BATTLE</p>
        </div>
      </div>
    </main>

    <section id="statusArea">
      <div class="panel">
        <div class="label">ELIMINATED</div>
        <div id="eliminatedFlags"></div>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const COUNTRY_CODES = [
      "AF", "AL", "DZ", "AD", "AO", "AG", "AR", "AM", "AU", "AT", "AZ", "BS", "BH", "BD", "BB",
      "BY", "BE", "BZ", "BJ", "BT", "BO", "BA", "BW", "BR", "BN", "BG", "BF", "BI", "CV", "KH",
      "CM", "CA", "CF", "TD", "CL", "CN", "CO", "KM", "CG", "CD", "CR", "CI", "HR", "CU", "CY",
      "CZ", "DK", "DJ", "DM", "DO", "EC", "EG", "SV", "GQ", "ER", "EE", "SZ", "ET", "FJ", "FI",
      "FR", "GA", "GM", "GE", "DE", "GH", "GR", "GD", "GT", "GN", "GW", "GY", "HT", "HN", "HU",
      "IS", "IN", "ID", "IR", "IQ", "IE", "IL", "IT", "JM", "JP", "JO", "KZ", "KE", "KI", "KP",
      "KR", "KW", "KG", "LA", "LV", "LB", "LS", "LR", "LY", "LI", "LT", "LU", "MG", "MW", "MY",
      "MV", "ML", "MT", "MH", "MR", "MU", "MX", "FM", "MD", "MC", "MN", "ME", "MA", "MZ", "MM",
      "NA", "NR", "NP", "NL", "NZ", "NI", "NE", "NG", "MK", "NO", "OM", "PK", "PW", "PA", "PG",
      "PY", "PE", "PH", "PL", "PT", "QA", "RO", "RU", "RW", "KN", "LC", "VC", "WS", "SM", "ST",
      "SA", "SN", "RS", "SC", "SL", "SG", "SK", "SI", "SB", "SO", "ZA", "SS", "ES", "LK", "SD",
      "SR", "SE", "CH", "SY", "TJ", "TZ", "TH", "TL", "TG", "TO", "TT", "TN", "TR", "TM", "TV",
      "UG", "UA", "AE", "GB", "US", "UY", "UZ", "VU", "VE", "VN", "YE", "ZM", "ZW", "PS", "VA"
    ];

    const COUNTRY_NAME_OVERRIDES = {
      PS: "Palestine",
      VA: "Vatican City"
    };

    function codeToFlagEmoji(code) {
      return code
        .toUpperCase()
        .replace(/./g, (char) => String.fromCodePoint(127397 + char.charCodeAt(0)));
    }

    function slugifyCountryName(name) {
      return name
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function buildCountries() {
      const regionNames = new Intl.DisplayNames(["en"], { type: "region" });
      const usedIds = new Set();
      return COUNTRY_CODES.map((code) => {
        const displayName = COUNTRY_NAME_OVERRIDES[code] || regionNames.of(code) || code;
        let id = slugifyCountryName(displayName);
        if (usedIds.has(id)) {
          id = `${id}-${code.toLowerCase()}`;
        }
        usedIds.add(id);
        return {
          id,
          name: displayName,
          flag: codeToFlagEmoji(code),
          code
        };
      });
    }

    function validateCountries(countries) {
      const issues = [];
      const seenIds = new Set();
      const seenNames = new Set();
      for (const country of countries) {
        if (!country.id || !country.name || !country.flag) {
          issues.push(`Invalid country record: ${JSON.stringify(country)}`);
          continue;
        }
        if (seenIds.has(country.id)) {
          issues.push(`Duplicate id: ${country.id}`);
        }
        if (seenNames.has(country.name.toLowerCase())) {
          issues.push(`Duplicate country name: ${country.name}`);
        }
        seenIds.add(country.id);
        seenNames.add(country.name.toLowerCase());
      }
      if (countries.length !== 195) {
        issues.push(`Expected 195 countries, got ${countries.length}`);
      }
      if (issues.length > 0) {
        throw new Error(`Country validation failed:\n${issues.join("\n")}`);
      }
      console.log(`COUNTRIES LOADED: ${countries.length}`);
    }

    const COUNTRIES = buildCountries();
    validateCountries(COUNTRIES);

    const ROUND_CONFIG = {
      autoNextRound: true,
      winnerDisplayMs: 6000,
      countdownEnabled: true,
      countdownSeconds: 3
    };

    const HAZARD_CONFIG = {
      firstHazardMinMs: 2200,
      firstHazardMaxMs: 4000,
      intervalMinMs: 1500,
      intervalMaxMs: 3000,
      warningMinMs: 520,
      warningMaxMs: 800,
      quickSpawnMinMs: 180,
      quickSpawnMaxMs: 420,
      arrowLengthMin: 155,
      arrowLengthMax: 220,
      arrowWidthMin: 6,
      arrowWidthMax: 10,
      arrowHeadLengthMin: 34,
      arrowHeadLengthMax: 44,
      arrowHeadWidthMin: 24,
      arrowHeadWidthMax: 32
    };

    const VOICE_CONFIG = {
      enabled: true,
      volume: 1.0,
      rate: 0.92,
      pitch: 0.95,
      minGapMs: 260
    };

    const POWERUP_CONFIG = {
      shieldEnabled: true,
      firstShieldMinMs: 5000,
      firstShieldMaxMs: 10000,
      respawnMinMs: 8000,
      respawnMaxMs: 15000,
      pickupRadius: 9
    };

    const LAYOUT_CONFIG = {
      arenaWidthRatio: 0.93,
      arenaMaxDiameter: 675,
      arenaMinDiameter: 240,
      eliminatedPanelHeightRatio: 0.12,
      eliminatedPanelReservedMin: 140,
      eliminatedPanelReservedMax: 210,
      arenaVerticalMargins: 10
    };

    const CONFIG = {
      countryCount: COUNTRIES.length,
      arenaPadding: 22,
      flagRadius: 13,
      friction: 0.9984,
      collisionRestitution: 0.92,
      wallRestitution: 0.96,
      jitterAcceleration: 9,
      spawnPadding: 3,
      seed: 12345,
      collisionParticleCount: 4,
      eliminationParticleCount: 26,
      collisionSoundCooldownMs: 75,
      preferredSpeedBase: 160,
      preferredSpeedVariance: 12,
      minSpeedFactor: 0.7,
      maxSpeedFactor: 1.5,
      speedRecoveryMin: 190,
      speedRecoveryMax: 270,
      wallInwardImpulseMin: 20,
      wallInwardImpulseMax: 40,
      wallMinInwardSpeed: 45,
      wallOrbitFrameThreshold: 6
    };

    const TAU = Math.PI * 2;

    const VOICE_PRIORITY = {
      MILESTONE: 2,
      WINNER: 4
    };

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function numberToWords(number) {
      const units = [
        "zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
        "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen",
        "seventeen", "eighteen", "nineteen"
      ];
      const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
      if (number < 20) return units[number];
      if (number < 100) {
        const ten = Math.floor(number / 10);
        const rem = number % 10;
        return rem === 0 ? tens[ten] : `${tens[ten]}-${units[rem]}`;
      }
      if (number < 1000) {
        const hundred = Math.floor(number / 100);
        const rem = number % 100;
        return rem === 0 ? `${units[hundred]} hundred` : `${units[hundred]} hundred ${numberToWords(rem)}`;
      }
      return String(number);
    }

    function distPointToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const denom = abx * abx + aby * aby || 1;
      const t = clamp((apx * abx + apy * aby) / denom, 0, 1);
      const qx = ax + abx * t;
      const qy = ay + aby * t;
      return Math.hypot(px - qx, py - qy);
    }

    function pointInTriangle(px, py, ax, ay, bx, by, cx, cy) {
      const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
      const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
      const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
      const hasNeg = d1 < 0 || d2 < 0 || d3 < 0;
      const hasPos = d1 > 0 || d2 > 0 || d3 > 0;
      return !(hasNeg && hasPos);
    }

    function circleIntersectsTriangle(cx, cy, radius, tri) {
      const { tip, left, right } = tri;
      if (pointInTriangle(cx, cy, tip.x, tip.y, left.x, left.y, right.x, right.y)) {
        return true;
      }
      if (distPointToSegment(cx, cy, tip.x, tip.y, left.x, left.y) <= radius) {
        return true;
      }
      if (distPointToSegment(cx, cy, left.x, left.y, right.x, right.y) <= radius) {
        return true;
      }
      if (distPointToSegment(cx, cy, right.x, right.y, tip.x, tip.y) <= radius) {
        return true;
      }
      return false;
    }

    class RNG {
      constructor(seed) {
        this.setSeed(seed);
      }

      setSeed(seed) {
        this.state = (Number(seed) >>> 0) || 1;
      }

      next() {
        let t = (this.state += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }

      range(min, max) {
        return min + (max - min) * this.next();
      }
    }

    class FlagToken {
      constructor(country, x, y, vx, vy, radius, speedProfile) {
        this.country = country;
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = radius;
        this.mass = Math.max(1, (radius * radius) / 120);
        this.alive = true;
        this.supportGlow = 0;
        this.preferredSpeed = speedProfile.preferred;
        this.minSpeed = speedProfile.min;
        this.maxSpeed = speedProfile.max;
        this.speedRecovery = speedProfile.recovery;
        this.hasShield = false;
        this.shieldFlash = 0;
        this.shieldOrbit = Math.random() * TAU;
        this.wallContactFrames = 0;
      }
    }

    class ParticleSystem {
      constructor(limit = 900) {
        this.limit = limit;
        this.particles = [];
      }

      emitBurst(x, y, count, opts) {
        const emitCount = Math.min(count, this.limit - this.particles.length);
        for (let i = 0; i < emitCount; i += 1) {
          const angle = Math.random() * TAU;
          const speed = opts.speedMin + Math.random() * (opts.speedMax - opts.speedMin);
          const life = opts.lifeMin + Math.random() * (opts.lifeMax - opts.lifeMin);
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life,
            maxLife: life,
            size: opts.sizeMin + Math.random() * (opts.sizeMax - opts.sizeMin),
            color: opts.color
          });
        }
      }

      emitCollision(x, y, intensity) {
        const power = clamp(intensity, 0.08, 1);
        this.emitBurst(x, y, Math.round(2 + CONFIG.collisionParticleCount * power), {
          color: "rgba(143, 224, 255, 0.9)",
          speedMin: 22,
          speedMax: 170 * power + 40,
          lifeMin: 0.1,
          lifeMax: 0.26,
          sizeMin: 0.7,
          sizeMax: 2.2
        });
      }

      emitElimination(x, y) {
        this.emitBurst(x, y, CONFIG.eliminationParticleCount, {
          color: "rgba(255, 118, 151, 0.95)",
          speedMin: 70,

        });
        this.emitBurst(x, y, 12, {
          color: "rgba(255, 235, 243, 0.85)",
          speedMin: 40,

        });
      }

      emitShieldSpawn(x, y) {
        this.emitBurst(x, y, 12, {
          color: "rgba(126, 236, 255, 0.9)",
          speedMin: 14,
          speedMax: 72,

          lifeMax: 0.5,

        });
      }

      emitShieldPickup(x, y) {
